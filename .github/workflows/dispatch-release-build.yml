# One-shot: the cloud agent token cannot call workflow_dispatch (it lacks actions:write).
# This job runs only for the commit that asks to dispatch the 1.9.1 release build.
# It starts .github/workflows/release-build.yml on the v1.9.1 tag and does not publish a release.
name: Dispatch release build

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, 'Dispatch the 1.9.1 release build')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release-build on tag v1.9.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/jjames06/Rampart/actions/workflows/release-build.yml/dispatches -f ref=v1.9.1
